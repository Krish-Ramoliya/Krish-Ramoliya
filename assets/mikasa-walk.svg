<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="140" viewBox="0 0 1200 140">

  <rect width="1200" height="140" fill="transparent"/>

  <!-- ground line -->
  <line x1="0" y1="112" x2="1200" y2="112" stroke="#00FFF0" stroke-width="2" opacity="0.25"/>

  <!-- Mikasa GIF walking -->
  <image
    x="0" y="30"
    width="90" height="90"
    preserveAspectRatio="xMidYMid meet"
    href="https://raw.githubusercontent.com/Krish-Ramoliya/Krish-Ramoliya/main/assets/mikasa.gif"
    xlink:href="https://raw.githubusercontent.com/Krish-Ramoliya/Krish-Ramoliya/main/assets/mikasa.gif">

    <animate attributeName="x"
             values="-120;1200"
             dur="10s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0;1"
             keySplines="0.42 0 0.58 1"/>
  </image>

  <!-- shadow -->
  <ellipse cx="35" cy="115" rx="22" ry="7" fill="#000" opacity="0.25">
    <animate attributeName="cx"
             values="-80;1240"
             dur="10s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0;1"
             keySplines="0.42 0 0.58 1"/>
  </ellipse>

  <!-- text -->
  <text x="20" y="26"
        fill="#00FFF0"
        font-family="Fira Code, monospace"
        font-size="16"
        opacity="0.65">
    Scout Patrol...
  </text>

</svg>

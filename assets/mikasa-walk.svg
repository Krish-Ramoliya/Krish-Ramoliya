<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140">

  <rect width="1200" height="140" fill="transparent"/>

  <line x1="0" y1="112" x2="1200" y2="112" stroke="#00FFF0" stroke-width="2" opacity="0.25"/>

  <!-- ✅ EMBEDDED Mikasa PNG (Base64) -->
  <image
    x="-120" y="25"
    width="95" height="95"
    preserveAspectRatio="xMidYMid meet"
    href="PASTE_BASE64_HERE">
    <animate attributeName="x" values="-120;1200" dur="10s" repeatCount="indefinite"/>
  </image>

  <ellipse cx="35" cy="115" rx="22" ry="7" fill="#000" opacity="0.25">
    <animate attributeName="cx" values="-80;1240" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <text x="20" y="26"
        fill="#00FFF0"
        font-family="Fira Code, monospace"
        font-size="16"
        opacity="0.65">
    Scout Patrol...
